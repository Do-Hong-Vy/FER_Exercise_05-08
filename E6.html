<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Exercise 6 - Website layout</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
  </head>
  <body>
    <nav
      class="navbar navbar-expand-lg navbar-light bg-white border-bottom py-2"
    >
      <div class="container">
        <a class="navbar-brand text-secondary" href="#">Navbar</a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarContent"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active text-secondary" href="#">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-secondary text-opacity-50" href="#"
                >Link</a
              >
            </li>
            <li class="nav-item dropdown">
              <a
                class="nav-link dropdown-toggle text-secondary text-opacity-50"
                href="#"
                role="button"
                data-bs-toggle="dropdown"
              >
                Dropdown
              </a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">Action</a></li>
                <li><a class="dropdown-item" href="#">Another action</a></li>
              </ul>
            </li>
          </ul>

          <form class="d-flex">
            <input
              class="form-control rounded-0 me-2 text-secondary"
              type="search"
              placeholder="Search"
            />
            <button class="btn btn-outline-primary rounded-0" type="submit">
              Search
            </button>
          </form>
        </div>
      </div>
    </nav>

    <div id="mainCarousel" class="carousel slide" data-bs-ride="carousel">
      <div class="carousel-indicators">
        <button
          type="button"
          data-bs-target="#mainCarousel"
          data-bs-slide-to="0"
          class="active"
        ></button>
        <button
          type="button"
          data-bs-target="#mainCarousel"
          data-bs-slide-to="1"
        ></button>
        <button
          type="button"
          data-bs-target="#mainCarousel"
          data-bs-slide-to="2"
        ></button>
      </div>

      <div class="carousel-inner">
        <div class="carousel-item active">
          <img
            src="https://placehold.co/1920x530/cccccc/999999?text=1920+x+530"
            class="d-block w-100"
            alt="Banner 1"
          />
        </div>
        <div class="carousel-item">
          <img
            src="https://placehold.co/1920x530/cccccc/999999?text=1920+x+530"
            class="d-block w-100"
            alt="Banner 2"
          />
        </div>
        <div class="carousel-item">
          <img
            src="https://placehold.co/1920x530/cccccc/999999?text=1920+x+530"
            class="d-block w-100"
            alt="Banner 3"
          />
        </div>
      </div>

      <button
        class="carousel-control-prev"
        type="button"
        data-bs-target="#mainCarousel"
        data-bs-slide="prev"
      >
        <span class="carousel-control-prev-icon"></span>
      </button>
      <button
        class="carousel-control-next"
        type="button"
        data-bs-target="#mainCarousel"
        data-bs-slide="next"
      >
        <span class="carousel-control-next-icon"></span>
      </button>
    </div>

    <section class="container my-5">
      <h3 class="fw-light text-secondary mb-0">NEW PRODUCT</h3>
      <p class="text-muted small mb-4">List product description</p>

      <div class="row g-4">
        <div class="col-12 col-sm-6 col-md-3">
          <div class="card rounded-0 border-light shadow-sm h-100">
            <img
              src="https://placehold.co/280x280/cccccc/999999?text=280+x+280"
              class="card-img-top rounded-0"
              alt="Product"
            />
            <div class="card-body">
              <h6 class="card-title text-secondary">Product</h6>

              <div
                class="d-flex justify-content-between align-items-center mb-3"
              >
                <small class="text-decoration-line-through text-muted"
                  >100.000 vnđ</small
                >
                <small class="text-warning">80.000 vnđ</small>
              </div>

              <div class="d-flex gap-2">
                <button class="btn btn-primary rounded-0 px-3">
                  <i class="bi bi-cart-fill"></i>
                </button>
                <button class="btn btn-outline-secondary rounded-0 w-100">
                  Xem chi tiết
                </button>
              </div>
            </div>
          </div>
        </div>

        <div class="col-12 col-sm-6 col-md-3">
          <div class="card rounded-0 border-light shadow-sm h-100">
            <img
              src="https://placehold.co/280x280/cccccc/999999?text=280+x+280"
              class="card-img-top rounded-0"
              alt="Product"
            />
            <div class="card-body">
              <h6 class="card-title text-secondary">Product</h6>

              <div
                class="d-flex justify-content-between align-items-center mb-3"
              >
                <small class="text-decoration-line-through text-muted"
                  >100.000 vnđ</small
                >
                <small class="text-warning">80.000 vnđ</small>
              </div>

              <div class="d-flex gap-2">
                <button class="btn btn-primary rounded-0 px-3">
                  <i class="bi bi-cart-fill"></i>
                </button>
                <button class="btn btn-outline-secondary rounded-0 w-100">
                  Xem chi tiết
                </button>
              </div>
            </div>
          </div>
        </div>

        <div class="col-12 col-sm-6 col-md-3">
          <div class="card rounded-0 border-light shadow-sm h-100">
            <img
              src="https://placehold.co/280x280/cccccc/999999?text=280+x+280"
              class="card-img-top rounded-0"
              alt="Product"
            />
            <div class="card-body">
              <h6 class="card-title text-secondary">Product</h6>

              <div
                class="d-flex justify-content-between align-items-center mb-3"
              >
                <small class="text-decoration-line-through text-muted"
                  >100.000 vnđ</small
                >
                <small class="text-warning">80.000 vnđ</small>
              </div>

              <div class="d-flex gap-2">
                <button class="btn btn-primary rounded-0 px-3">
                  <i class="bi bi-cart-fill"></i>
                </button>
                <button class="btn btn-outline-secondary rounded-0 w-100">
                  Xem chi tiết
                </button>
              </div>
            </div>
          </div>
        </div>

        <div class="col-12 col-sm-6 col-md-3">
          <div
            class="card rounded-0 border-light shadow-sm h-100 position-relative"
          >
            <span
              class="position-absolute top-0 end-0 badge bg-warning rounded-0 fs-6 m-3"
              >Sale</span
            >

            <img
              src="https://placehold.co/280x280/cccccc/999999?text=280+x+280"
              class="card-img-top rounded-0"
              alt="Product"
            />
            <div class="card-body">
              <h6 class="card-title text-secondary">Product</h6>

              <div
                class="d-flex justify-content-between align-items-center mb-3"
              >
                <small class="text-decoration-line-through text-muted"
                  >100.000 vnđ</small
                >
                <small class="text-warning">80.000 vnđ</small>
              </div>

              <div class="d-flex gap-2">
                <button class="btn btn-primary rounded-0 px-3">
                  <i class="bi bi-cart-fill"></i>
                </button>
                <button class="btn btn-outline-secondary rounded-0 w-100">
                  Xem chi tiết
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
