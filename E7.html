<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Exercise 7 - Cards Column</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container mt-4">
      <h2 class="mb-4">Cards Columns</h2>

      <div class="row g-4">
        <div class="col-md-4">
          <div class="card bg-primary p-3 border-0 rounded-1 h-100">
            <div class="bg-white">
              <img
                src="./image/car.png"
                class="card-img-top rounded-0"
                alt="Car image"
              />
            </div>
            <div class="card-body p-2 text-center">
              <p class="card-text text-dark mb-0">
                Some text inside the first card
              </p>
            </div>
          </div>
        </div>

        <div class="col-md-4">
          <div class="card bg-warning p-3 border-0 rounded-1 h-100">
            <div class="bg-white">
              <img
                src="./image/car.png"
                class="card-img-top rounded-0"
                alt="Car image"
              />
            </div>
            <div class="card-body p-2 text-center">
              <p class="card-text text-dark mb-0">
                Some text inside the first card
              </p>
            </div>
          </div>
        </div>

        <div class="col-md-4">
          <div class="card bg-danger p-3 border-0 rounded-1 h-100">
            <div class="bg-white">
              <img
                src="./image/car.png"
                class="card-img-top rounded-0"
                alt="Car image"
              />
            </div>
            <div class="card-body p-2 text-center">
              <p class="card-text text-dark mb-0">
                Some text inside the first card
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
