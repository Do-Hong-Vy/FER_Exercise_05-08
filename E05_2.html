<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <title>My First Bootstrap Page</title>
  </head>
  <body class="bg-white">
    <header class="bg-body-secondary py-5">
      <div class="container text-center">
        <h1 class="display-6 fw-semibold mb-0">My First Bootstrap Page</h1>
      </div>
    </header>

    <main class="container py-5">
      <div class="row align-items-center g-5 justify-content-center">
        <div class="col-12 col-md-4 text-center">
          <img
            src="./image/html-icon.png"
            class="img-fluid w-75"
            alt="HTML5 logo"
          />
        </div>
        <div class="col-12 col-md-4 text-center">
          <img
            src="./image/css-icon.png"
            class="img-fluid w-75"
            alt="CSS3 logo"
          />
        </div>
        <div class="col-12 col-md-4 text-center">
          <img
            src="./image/bootstrap-5-logo-icon.png"
            class="img-fluid w-75"
            alt="Bootstrap logo"
          />
        </div>
      </div>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
